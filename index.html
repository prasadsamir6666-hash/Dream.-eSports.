<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREAM ESPORTS - India</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #0a0a12;
      --card: rgba(22,22,37,.78);
      --gold: #f39c12;
      --text: #e2e8f0;
      --muted: #a4b0be;
      --green: #2ed573;
      --red: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 50% 0%, #1a1a3a 0%, #0a0a12 70%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      background: rgba(10,10,18,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(243,156,18,.25);
    }

    .logo {
      color: var(--gold);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .wallet {
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 7px 13px;
      font-size: 13px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .banner {
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 18px;
      background: linear-gradient(135deg,#24243e,#302b63);
      border: 1px solid rgba(255,255,255,.1);
    }

    .banner h2 {
      font-size: 19px;
      margin-bottom: 6px;
    }

    .banner p {
      color: var(--muted);
      font-size: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 18px 0 12px;
    }

    #tournamentList {
      min-height: 50px;
    }

    .match-card {
      background: var(--card);
      border: 1px solid rgba(243,156,18,.22);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 13px;
    }

    .match-title {
      font-size: 15px;
      font-weight: 700;
    }

    .tag {
      background: var(--gold);
      color: #000;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      background: rgba(0,0,0,.25);
      padding: 10px;
      border-radius: 10px;
    }

    .detail {
      text-align: center;
    }

    .detail span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 4px;
    }

    .detail strong {
      font-size: 13px;
    }

    .status {
      margin-top: 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 25px 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .error {
      color: var(--red);
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      background: rgba(10,10,18,.96);
      border-top: 1px solid rgba(243,156,18,.2);
    }

    .nav-item {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item i {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .nav-item.active {
      color: var(--gold);
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <i class="fa-solid fa-crown"></i>
    DREAM ESPORTS
  </div>

  <div class="wallet">
    <i class="fa-solid fa-wallet"></i>
    ₹ <span id="balance">150</span>
  </div>
</header>

<div class="container">

  <!-- HOME -->
  <div id="home-tab" class="tab active">

    <div class="banner">
      <h2>
        <i class="fa-solid fa-trophy"></i>
        DREAM ESPORTS
      </h2>
      <p>Official tournament platform</p>
    </div>

    <div class="section-title">
      <i class="fa-solid fa-fire"></i>
      Available Tournaments
    </div>

    <div id="tournamentList">
      <div class="loading">
        Loading tournaments...
      </div>
    </div>

  </div>

  <!-- MY MATCHES -->
  <div id="matches-tab" class="tab">

    <div class="section-title">
      <i class="fa-solid fa-gamepad"></i>
      My Matches
    </div>

    <div class="match-card">
      <div class="empty">
        No joined matches yet.
      </div>
    </div>

  </div>

  <!-- WALLET -->
  <div id="wallet-tab" class="tab">

    <div class="section-title">
      <i class="fa-solid fa-wallet"></i>
      My Wallet
    </div>

    <div class="match-card">
      <div class="detail">
        <span>CURRENT BALANCE</span>
        <strong style="font-size:28px;color:var(--gold)">
          ₹150
        </strong>
      </div>
    </div>

  </div>

  <!-- SUPPORT -->
  <div id="support-tab" class="tab">

    <div class="section-title">
      <i class="fa-solid fa-headset"></i>
      Help & Support
    </div>

    <div class="match-card">
      <p style="color:var(--muted);font-size:13px;">
        Need help? Contact Dream eSports support.
      </p>
    </div>

  </div>

</div>

<!-- NAVIGATION -->
<div class="bottom-nav">

  <div class="nav-item active"
       onclick="switchTab('home-tab', this)">
    <i class="fa-solid fa-house"></i>
    Home
  </div>

  <div class="nav-item"
       onclick="switchTab('matches-tab', this)">
    <i class="fa-solid fa-gamepad"></i>
    My Matches
  </div>

  <div class="nav-item"
       onclick="switchTab('wallet-tab', this)">
    <i class="fa-solid fa-wallet"></i>
    Wallet
  </div>

  <div class="nav-item"
       onclick="switchTab('support-tab', this)">
    <i class="fa-solid fa-headset"></i>
    Support
  </div>

</div>


<!-- FIREBASE -->
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyAeZnZ4tNZ7qYc0jfRdBq4J_Eahop37Qn4",
    authDomain: "dream-esports-51780.firebaseapp.com",
    projectId: "dream-esports-51780",
    storageBucket: "dream-esports-51780.firebasestorage.app",
    messagingSenderId: "959473187247",
    appId: "1:959473187247:web:11c11f1a5f810dc4fcd75a",
    measurementId: "G-37FE1WPFXG"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  async function loadTournaments() {

    const list = document.getElementById("tournamentList");

    try {

      const snapshot =
        await getDocs(collection(db, "tournaments"));

      if (snapshot.empty) {

        list.innerHTML =
          '<div class="empty">No tournaments available.</div>';

        return;
      }


      list.innerHTML = "";


      snapshot.forEach((doc) => {

        const data = doc.data();

        const name =
          data.name || "Free Fire Tournament";

        const type =
          data.type || "TOURNAMENT";

        const prize =
          data.prize || data.prizePool || "—";

        const entry =
          data.entryFee || data.entry || "—";

        const status =
          data.status || "UPCOMING";


        const card = document.createElement("div");

        card.className = "match-card";


        card.innerHTML = `

          <div class="card-header">

            <span class="match-title">
              ${name}
            </span>

            <span class="tag">
              ${type}
            </span>

          </div>


          <div class="details">

            <div class="detail">
              <span>PRIZE</span>
              <strong>${prize}</strong>
            </div>

            <div class="detail">
              <span>ENTRY</span>
              <strong>${entry}</strong>
            </div>

            <div class="detail">
              <span>STATUS</span>
              <strong>${status}</strong>
            </div>

          </div>


          <div class="status">
            <i class="fa-solid fa-circle"></i>
            ${status}
          </div>

        `;


        list.appendChild(card);

      });

    } catch (error) {

      console.error(error);

      list.innerHTML =
        '<div class="error">Unable to load tournaments.</div>';

    }

  }


  loadTournaments();


  window.switchTab = function(tabId, element) {

    document
      .querySelectorAll(".tab")
      .forEach(tab => tab.classList.remove("active"));

    document
      .querySelectorAll(".nav-item")
      .forEach(item => item.classList.remove("active"));

    document
      .getElementById(tabId)
      .classList.add("active");

    element.classList.add("active");

  };

</script>

</body>
    
</html>
