<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DREAM ESPORTS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#080808;
    color:white;
    padding-bottom:80px;
}

.header{
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#111;
    border-bottom:1px solid #333;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:#f5b400;
}

.wallet{
    background:#1b1b1b;
    padding:9px 14px;
    border-radius:20px;
    font-weight:bold;
}

.hero{
    margin:18px;
    padding:25px 20px;
    border-radius:18px;
    background:linear-gradient(135deg,#302500,#111);
    border:1px solid #665000;
}

.hero small{
    color:#f5b400;
    font-weight:bold;
}

.hero h1{
    margin-top:8px;
    font-size:27px;
}

.hero p{
    margin-top:8px;
    color:#aaa;
    font-size:13px;
}

.section{
    padding:0 18px;
}

.section-title{
    margin:25px 0 15px;
    font-size:20px;
}

#tournamentList{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.card{
    background:#121212;
    border:1px solid #303030;
    border-radius:17px;
    padding:17px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.name{
    font-size:19px;
    font-weight:bold;
}

.mode{
    color:#999;
    margin-top:6px;
    font-size:13px;
}

.status{
    color:#f5b400;
    background:#211c08;
    border-radius:20px;
    padding:6px 10px;
    font-size:11px;
    font-weight:bold;
    height:max-content;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
}

.detail{
    background:#1b1b1b;
    border-radius:10px;
    padding:11px;
}

.label{
    display:block;
    color:#777;
    font-size:10px;
    margin-bottom:5px;
}

.value{
    font-size:13px;
    font-weight:bold;
}

.join{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:0;
    border-radius:11px;
    background:#f5b400;
    color:#000;
    font-weight:800;
    font-size:14px;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:30px 15px;
    background:#121212;
    border:1px solid #292929;
    border-radius:15px;
    color:#999;
}

.error{
    color:#ff7777;
}

.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#101010;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav{
    text-align:center;
    color:#777;
    font-size:11px;
}

.nav.active{
    color:#f5b400;
}

.icon{
    font-size:20px;
    margin-bottom:4px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:400px;
    background:#161616;
    border:1px solid #333;
    border-radius:18px;
    padding:22px;
}

.modal-box h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #333;
    background:#0b0b0b;
    color:white;
}

.buttons{
    display:flex;
    gap:10px;
}

.buttons button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:10px;
    font-weight:bold;
}

.cancel{
    background:#333;
    color:white;
}

.confirm{
    background:#f5b400;
    color:#000;
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        DREAM <span>ESPORTS</span>
    </div>

    <div class="wallet">
        ₹<span id="balance">150</span>
    </div>
</header>


<section class="hero">
    <small>FREE FIRE ESPORTS</small>
    <h1>Play. Compete. Win.</h1>
    <p>Join tournaments and compete with players.</p>
</section>


<section class="section">

    <div class="section-title">
        Available Tournaments
    </div>

    <div id="tournamentList">
        <div class="loading">
            Loading tournaments...
        </div>
    </div>

</section>


<div class="bottom">

    <div class="nav active">
        <div class="icon">⌂</div>
        Home
    </div>

    <div class="nav">
        <div class="icon">⚔</div>
        Matches
    </div>

    <div class="nav">
        <div class="icon">◉</div>
        Wallet
    </div>

    <div class="nav">
        <div class="icon">?</div>
        Support
    </div>

</div>


<div class="modal" id="joinModal">

    <div class="modal-box">

        <h2>Join Tournament</h2>

        <input
            id="ffName"
            type="text"
            placeholder="Free Fire In-Game Name"
        >

        <input
            id="ffUid"
            type="text"
            placeholder="Free Fire UID"
        >

        <div class="buttons">

            <button
                class="cancel"
                onclick="closeModal()"
            >
                Cancel
            </button>

            <button
                class="confirm"
                onclick="confirmJoin()"
            >
                Join
            </button>

        </div>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyAeZnZ4tNZ7qYc0jfRdBq4J_Eahop37Qn4",

    authDomain:
    "dream-esports-51780.firebaseapp.com",

    projectId:
    "dream-esports-51780",

    storageBucket:
    "dream-esports-51780.firebasestorage.app",

    messagingSenderId:
    "959473187247",

    appId:
    "1:959473187247:web:11c11f1a5f810dc4fcd75a",

    measurementId:
    "G-37FE1WPFXG"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* LOAD TOURNAMENTS */

async function loadTournaments(){

    const list =
    document.getElementById("tournamentList");


    try{

        list.innerHTML =
        '<div class="loading">Loading tournaments...</div>';


        const snapshot =
        await getDocs(
            collection(db,"tournaments")
        );


        if(snapshot.empty){

            list.innerHTML =
            '<div class="empty">No tournaments available</div>';

            return;
        }


        list.innerHTML = "";


        snapshot.forEach((doc)=>{

            const data = doc.data();


            const name =
            data.Name || "Unnamed Tournament";


            const game =
            data.Game || "Free Fire";


            const mode =
            data.Mode || "1 VS 1";


            const date =
            data.Date || "Not set";


            const time =
            data.Time || "Not set";


            const players =
            data.Players ?? 0;


            const maxPlayers =
            data.Maxplayers ?? 0;


            const entryFee =
            data.entryfee ?? 0;


            const status =
            data["Status "] ||
            data.Status ||
            "Open";


            const card =
            document.createElement("div");


            card.className = "card";


            card.innerHTML = `

                <div class="card-top">

                    <div>

                        <div class="name">
                            ${name}
                        </div>

                        <div class="mode">
                            ${game} • ${mode}
                        </div>

                    </div>

                    <div class="status">
                        ${status}
                    </div>

                </div>


                <div class="details">

                    <div class="detail">

                        <span class="label">
                            DATE
                        </span>

                        <span class="value">
                            ${date}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="label">
                            TIME
                        </span>

                        <span class="value">
                            ${time}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="label">
                            PLAYERS
                        </span>

                        <span class="value">
                            ${players}/${maxPlayers}
                        </span>

                    </div>


                    <div class="detail">

                        <span class="label">
                            ENTRY
                        </span>

                        <span class="value">
                            ₹${entryFee}
                        </span>

                    </div>

                </div>


                <button
                    class="join"
                    onclick="openJoinModal('${doc.id}')"
                >
                    JOIN TOURNAMENT
                </button>

            `;


            list.appendChild(card);

        });


    }catch(error){

        console.error(
            "Firestore Error:",
            error
        );


        list.innerHTML =
        '<div class="error">Unable to load tournaments</div>';

    }

}


loadTournaments();

</script>


<script>

let selectedTournament = null;


function openJoinModal(id){

    selectedTournament = id;

    document.getElementById("joinModal").style.display =
    "flex";

}


function closeModal(){

    document.getElementById("joinModal").style.display =
    "none";

}


function confirmJoin(){

    const name =
    document.getElementById("ffName").value.trim();


    const uid =
    document.getElementById("ffUid").value.trim();


    if(!name || !uid){

        alert(
            "Please enter your Free Fire Name and UID."
        );

        return;

    }


    alert(
        "Registration feature will be connected next."
    );


    closeModal();

}

</script>

</body>
</html>
